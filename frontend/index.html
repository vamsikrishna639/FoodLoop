<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="FoodLoop: campus surplus food, from the canteen counter to people who need it." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FoodLoop</title>
    <script>
      // Apply the saved theme before the page paints, so a chalkboard user
      // never sees a flash of paper. ThemeContext keeps it in sync later.
      try {
        var saved = localStorage.getItem('foodloop_theme');
        document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
